[project]
id = "github.com/gossamer-lang/gui-gos"
version = "0.2.5"
gossamer-version = "^v0.78.1"
authors = ["Dan Pozmanter"]
license = "Apache 2.0"

[lib]
name = "gui"

# The engine's optional parts, which an application may leave out.
[features]
default = ["markup", "svg", "jpeg", "gif"]
markup = ["gui_engine/markup"]
svg = ["gui_engine/svg"]
jpeg = ["gui_engine/jpeg"]
gif = ["gui_engine/gif"]

[dependencies]
"github.com/gossamer-lang/windowing-gos" = { git = "https://github.com/gossamer-lang/windowing-gos", tag = "v0.1.17" }
"github.com/gossamer-lang/gui-engine-gos" = { git = "https://github.com/gossamer-lang/gui-engine-gos", tag = "v0.2.14", default-features = false }
